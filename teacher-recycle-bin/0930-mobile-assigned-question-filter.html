<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>移动端试题已布置标记与过滤</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --blue: #347ff5;
      --blue-soft: #eef5ff;
      --text: #25282f;
      --muted: #8e98a8;
      --line: #e9edf3;
      --option: #f5f6f9;
      --green: #149b6c;
      --green-soft: #eaf9f3;
    }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #edf2f7;
      font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--text);
    }
    button { border: 0; font: inherit; }
    .phone {
      position: relative;
      width: min(100vw, 430px);
      height: 100dvh;
      min-height: 640px;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 0 28px rgba(30, 50, 78, .12);
    }
    .underlay {
      height: 116px;
      background: #fff;
      color: #17283c;
      filter: grayscale(.55);
      opacity: .62;
    }
    .app-head {
      height: 43px;
      display: grid;
      grid-template-columns: 44px 1fr 112px;
      align-items: center;
      border-bottom: 1px solid #e9edf2;
      padding-top: env(safe-area-inset-top);
    }
    .app-head h1 {
      margin: 0;
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0;
    }
    .help-link {
      color: #3c7dcc;
      font-size: 13px;
      text-align: center;
      text-decoration: underline;
      text-underline-offset: 5px;
    }
    .back-mark,
    .panel-back {
      position: relative;
      width: 40px;
      height: 40px;
      background: transparent;
      cursor: pointer;
    }
    .back-mark::before,
    .panel-back::before {
      content: "";
      position: absolute;
      left: 19px;
      top: 13px;
      width: 10px;
      height: 10px;
      border-left: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg);
    }
    .course-tabs {
      height: 50px;
      display: grid;
      grid-template-columns: 84px 1px repeat(3, 1fr);
      align-items: center;
      color: #7b8390;
      font-size: 14px;
    }
    .grade {
      padding-left: 15px;
      color: #24272c;
    }
    .grade::after {
      content: "";
      display: inline-block;
      margin-left: 16px;
      border: 4px solid transparent;
      border-top-color: currentColor;
      transform: translateY(3px);
    }
    .tab-divider { width: 1px; height: 18px; background: #8e9298; }
    .course-tab {
      position: relative;
      height: 50px;
      display: grid;
      place-items: center;
    }
    .course-tab.active { color: #276ed6; font-weight: 800; }
    .course-tab.active::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 4px;
      width: 23px;
      height: 4px;
      border-radius: 4px;
      background: #2f76e7;
      transform: translateX(-50%);
    }
    .shade {
      position: absolute;
      inset: 0 0 auto;
      height: 96px;
      background: rgba(28, 30, 33, .34);
      pointer-events: none;
    }
    .detail-panel {
      position: absolute;
      left: 0;
      right: 0;
      top: 85px;
      bottom: 0;
      display: grid;
      grid-template-rows: 66px minmax(0, 1fr) 64px;
      overflow: hidden;
      border-radius: 14px 14px 0 0;
      background: #fff;
      box-shadow: 0 -4px 18px rgba(32, 55, 84, .12);
    }
    .detail-head {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid var(--line);
      padding: 0 12px 0 8px;
    }
    .panel-back { color: #91a5ba; }
    .detail-head h2 {
      margin: 0;
      text-align: center;
      color: #263951;
      font-size: 17px;
      font-weight: 800;
    }
    .score {
      color: #2377ed;
      font-size: 17px;
      text-align: right;
      white-space: nowrap;
    }
    .head-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .filter-button {
      height: 32px;
      border: 1px solid #72a7f6;
      border-radius: 7px;
      padding: 0 9px;
      background: #eff6ff;
      color: #2676e8;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }
    .filter-button.active { color: #fff; background: var(--blue); border-color: var(--blue); }
    .question-scroll {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 0 0 26px;
      scrollbar-width: none;
    }
    .question-scroll::-webkit-scrollbar { display: none; }
    .question-item {
      padding: 14px 15px 24px;
      border-bottom: 8px solid #f3f6fa;
      background: #fff;
    }
    .question-item:last-child { border-bottom: 0; }
    .meta-row {
      min-height: 33px;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 12px;
    }
    .mini-tag {
      height: 22px;
      display: inline-flex;
      align-items: center;
      border: 1px solid #3f8ef7;
      border-radius: 2px;
      padding: 0 5px;
      color: #2f81ef;
      background: #fff;
      font-size: 12px;
      white-space: nowrap;
    }
    .assigned-badge {
      height: 23px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid #73d7b0;
      border-radius: 4px;
      padding: 0 7px;
      color: var(--green);
      background: var(--green-soft);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }
    .assigned-badge::before { content: "\2713"; font-size: 11px; }
    .assigned-badge.hidden { display: none; }
    .add-basket {
      height: 30px;
      margin-left: auto;
      border-radius: 17px;
      padding: 0 14px;
      color: #3980dd;
      background: #f1f6ff;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
    }
    .add-basket.added { color: #8d9bad; background: #f1f3f6; }
    .audio-bar {
      height: 42px;
      display: grid;
      grid-template-columns: 31px 38px 1fr 40px;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      border-radius: 9px;
      padding: 0 12px;
      background: #fff;
      box-shadow: 0 3px 16px rgba(35, 75, 125, .08);
    }
    .play-button {
      position: relative;
      width: 27px;
      height: 27px;
      border-radius: 50%;
      background: #5b82fa;
      box-shadow: 0 0 0 4px #eaf0ff;
      cursor: pointer;
    }
    .play-button::after {
      content: "";
      position: absolute;
      left: 11px;
      top: 8px;
      border-left: 7px solid #fff;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
    }
    .audio-time { color: #8d96a5; font-size: 11px; }
    .audio-track { position: relative; height: 3px; border-radius: 3px; background: #d4dafa; }
    .audio-track::before {
      content: "";
      position: absolute;
      left: -6px;
      top: -5px;
      width: 10px;
      height: 10px;
      border: 3px solid #5b82fa;
      border-radius: 50%;
      background: #fff;
    }
    .audio-duration { color: #8d96a5; font-size: 11px; text-align: right; }
    .question-title {
      margin: 0 0 13px;
      color: #30333a;
      font-size: 18px;
      font-weight: 500;
      line-height: 1.42;
    }
    .option-list { display: grid; gap: 12px; }
    .option-row {
      display: grid;
      grid-template-columns: 20px 1fr;
      align-items: center;
      gap: 1px;
    }
    .option-label { font-size: 16px; font-weight: 800; }
    .option-box {
      min-height: 56px;
      display: flex;
      align-items: center;
      border-radius: 10px;
      padding: 10px 15px;
      background: var(--option);
      color: #363941;
      font-size: 18px;
      line-height: 1.35;
    }
    .knowledge {
      margin: 12px 0 17px;
      font-size: 16px;
      font-weight: 800;
    }
    .analysis-title {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: 800;
    }
    .analysis-title::after {
      content: "";
      border: 5px solid transparent;
      border-bottom-color: #28313c;
      transform: translateY(-2px);
    }
    .answer {
      min-height: 55px;
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      border-radius: 9px;
      padding: 0 14px;
      background: #eff1ff;
      color: #607df3;
      font-size: 17px;
      font-weight: 700;
    }
    .explanation-title { margin: 0 0 2px; font-size: 16px; font-weight: 800; }
    .explanation {
      margin: 0;
      color: #30333a;
      font-size: 16px;
      line-height: 1.72;
    }
    .bottom-action {
      display: flex;
      align-items: center;
      padding: 8px 15px max(8px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: #fff;
    }
    .bottom-action button {
      width: 100%;
      height: 43px;
      border-radius: 22px;
      color: #fff;
      background: var(--blue);
      font-size: 16px;
      cursor: pointer;
    }
    .toast {
      position: absolute;
      left: 50%;
      top: 130px;
      z-index: 8;
      min-width: 220px;
      max-width: calc(100% - 48px);
      border-radius: 8px;
      padding: 10px 14px;
      background: rgba(30, 42, 57, .92);
      color: #fff;
      font-size: 13px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -8px);
      transition: opacity .18s ease, transform .18s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 370px) {
      .detail-panel { grid-template-rows: 62px minmax(0, 1fr) 60px; }
      .detail-head { grid-template-columns: 38px minmax(0, 1fr) auto; gap: 4px; padding-right: 9px; }
      .detail-head h2 { font-size: 15px; }
      .head-actions { gap: 5px; }
      .score { font-size: 16px; }
      .filter-button { height: 30px; padding: 0 7px; font-size: 11px; }
      .question-item { padding-left: 12px; padding-right: 12px; }
      .mini-tag { padding: 0 4px; }
      .assigned-badge { padding: 0 5px; }
      .add-basket { padding: 0 10px; }
    }
  </style>
</head>
<body>
  <main class="phone" id="phone" data-filtering="false" data-visible-questions="4">
    <section class="underlay" aria-hidden="true">
      <header class="app-head">
        <button class="back-mark" type="button" aria-label="返回"></button>
        <h1>布置练习</h1>
        <span class="help-link">学生如何作答?</span>
      </header>
      <nav class="course-tabs">
        <span class="grade">高</span><i class="tab-divider"></i>
        <span class="course-tab">同步</span>
        <span class="course-tab">专项</span>
        <span class="course-tab active">模拟</span>
      </nav>
    </section>
    <div class="shade" aria-hidden="true"></div>

    <section class="detail-panel" aria-label="预备级模拟试题详情">
      <header class="detail-head">
        <button class="panel-back" type="button" aria-label="返回"></button>
        <h2>预备级模拟试题1</h2>
        <div class="head-actions">
          <button class="filter-button" id="assignedFilterToggle" type="button" aria-pressed="false">过滤已布置</button>
          <span class="score">30分</span>
        </div>
      </header>

      <div class="question-scroll" id="questionList"></div>

      <footer class="bottom-action">
        <button id="addAll" type="button">全部加入篮子</button>
      </footer>
    </section>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <script>
    const questions = [
      {
        number: 1,
        assigned: true,
        title: "What is the weather probably like today?",
        options: ["Cloudy.", "Rainy.", "Sunny."],
        answer: "C",
        knowledge: "事物与事实",
        explanation: "M: <strong>Why are you using an umbrella?</strong> There’s not a cloud in the sky!<br>W: Oh, <strong>I always carry one on days like this.</strong><br><strong>Sunlight is one of the main things that age our skin.</strong>"
      },
      {
        number: 2,
        assigned: false,
        title: "What does the woman suggest the man take?",
        options: ["A notebook.", "An umbrella.", "A camera."],
        answer: "B",
        knowledge: "推理判断",
        explanation: "W: The forecast says it may rain this afternoon.<br>M: Then <strong>I’ll take an umbrella with me.</strong>"
      },
      {
        number: 3,
        assigned: true,
        title: "How does the woman protect her skin?",
        options: ["By staying indoors.", "By carrying an umbrella.", "By wearing a hat."],
        answer: "B",
        knowledge: "细节理解",
        explanation: "The woman says she always carries an umbrella on sunny days because <strong>sunlight can age the skin.</strong>"
      },
      {
        number: 4,
        assigned: false,
        title: "What are the speakers mainly talking about?",
        options: ["Today’s weather.", "A travel plan.", "A new umbrella."],
        answer: "A",
        knowledge: "主旨大意",
        explanation: "The conversation focuses on the clear sky, sunlight and the reason for using an umbrella, so the answer is <strong>today’s weather.</strong>"
      }
    ];

    const phone = document.getElementById("phone");
    const filterButton = document.getElementById("assignedFilterToggle");
    const questionList = document.getElementById("questionList");
    const toast = document.getElementById("toast");
    let filtering = false;
    let toastTimer;

    function visibleQuestions() {
      return filtering ? questions.filter((question) => !question.assigned) : questions;
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => toast.classList.remove("show"), 1500);
    }

    function renderQuestions() {
      const visible = visibleQuestions();
      phone.dataset.filtering = String(filtering);
      phone.dataset.visibleQuestions = String(visible.length);
      questionList.innerHTML = visible.map((question) => `
        <article class="question-item" data-question-number="${question.number}" data-assigned="${question.assigned}" aria-label="第${question.number}题">
          <div class="meta-row">
            <span class="mini-tag">${question.number}</span>
            <span class="mini-tag">单选题</span>
            <span class="mini-tag">1.5分</span>
            ${question.assigned ? '<span class="assigned-badge">已布置</span>' : ''}
            <button class="add-basket" type="button" data-add-basket>加入篮子</button>
          </div>
          <div class="audio-bar">
            <button class="play-button" type="button" data-play-audio aria-label="播放第${question.number}题音频"></button>
            <span class="audio-time">00:00</span>
            <span class="audio-track"></span>
            <span class="audio-duration">--:--</span>
          </div>
          <h3 class="question-title">${question.title}</h3>
          <div class="option-list">
            ${question.options.map((option, index) => `
              <div class="option-row">
                <span class="option-label">${String.fromCharCode(65 + index)}</span>
                <span class="option-box">${option}</span>
              </div>
            `).join("")}
          </div>
          <div class="knowledge">考点：<span>${question.knowledge}</span></div>
          <div class="analysis-title">答案解析</div>
          <div class="answer">${question.answer}</div>
          <p class="explanation-title">解析：</p>
          <p class="explanation">${question.explanation}</p>
        </article>
      `).join("");
      questionList.scrollTop = 0;
    }

    filterButton.addEventListener("click", () => {
      filtering = !filtering;
      filterButton.classList.toggle("active", filtering);
      filterButton.setAttribute("aria-pressed", String(filtering));
      filterButton.textContent = filtering ? "取消过滤" : "过滤已布置";
      renderQuestions();
      const assignedCount = questions.filter((question) => question.assigned).length;
      showToast(filtering ? `已过滤 ${assignedCount} 道已布置试题` : "已取消过滤，显示全部试题");
    });

    questionList.addEventListener("click", (event) => {
      const addButton = event.target.closest("[data-add-basket]");
      if (addButton) {
        addButton.classList.add("added");
        addButton.textContent = "已加入";
        showToast("当前试题已加入篮子");
        return;
      }
      const playButton = event.target.closest("[data-play-audio]");
      if (playButton) {
        playButton.closest(".audio-bar").querySelector(".audio-time").textContent = "00:06";
        showToast("正在播放音频");
      }
    });

    document.getElementById("addAll").addEventListener("click", () => {
      showToast(`已将当前 ${visibleQuestions().length} 道试题加入篮子`);
    });

    renderQuestions();
  </script>
</body>
</html>
