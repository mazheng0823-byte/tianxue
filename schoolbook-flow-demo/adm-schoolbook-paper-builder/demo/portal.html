<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校本组卷项目 · 原型目录</title>
  <style>
    :root {
      --nav:#263943;
      --nav-strong:#172a34;
      --blue:#338df4;
      --blue-soft:#eaf4ff;
      --green:#20a67a;
      --green-soft:#e8f8f2;
      --ink:#19324d;
      --muted:#7e90a4;
      --line:#dce5ed;
      --surface:#fff;
      --page:#f2f5f8;
    }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif; color:var(--ink); letter-spacing:0; }
    body { background:var(--page); }
    button,a { font:inherit; }
    .topbar { height:64px; padding:0 32px; display:flex; align-items:center; justify-content:space-between; gap:24px; color:#fff; background:var(--nav); }
    .brand { display:flex; align-items:center; gap:12px; font-size:19px; font-weight:700; }
    .brand-mark { width:30px; height:30px; display:grid; place-items:center; border:1px solid rgba(255,255,255,.4); border-radius:4px; }
    .environment { padding:4px 8px; color:#c8d5dc; border:1px solid #667983; border-radius:4px; font-size:12px; font-weight:400; }
    .top-meta { color:#c7d3d9; font-size:14px; }
    .layout { min-height:calc(100vh - 64px); display:grid; grid-template-columns:220px minmax(0,1fr); }
    .sidebar { padding:28px 18px; color:#cbd5da; background:var(--nav-strong); }
    .sidebar-title { padding:0 12px 18px; color:#8fa2ad; font-size:12px; }
    .nav-item { width:100%; height:44px; padding:0 12px; display:flex; align-items:center; gap:10px; color:#d9e2e7; text-decoration:none; border-left:3px solid transparent; }
    .nav-item.active { color:#fff; border-left-color:#35b5e8; background:#243c48; }
    .nav-item svg { width:18px; height:18px; }
    main { min-width:0; padding:32px; }
    .breadcrumb { margin-bottom:22px; color:var(--muted); font-size:14px; }
    .page-head { margin-bottom:24px; display:flex; align-items:end; justify-content:space-between; gap:20px; }
    h1 { margin:0 0 7px; font-size:26px; }
    .subtitle { margin:0; color:var(--muted); font-size:14px; }
    .summary { display:flex; gap:22px; color:var(--muted); font-size:14px; }
    .summary strong { margin-right:5px; color:var(--ink); font-size:18px; }
    .entries { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; }
    .entry { min-width:0; min-height:250px; padding:24px; display:flex; flex-direction:column; color:inherit; text-decoration:none; border:1px solid var(--line); border-top:3px solid var(--blue); border-radius:6px; background:var(--surface); box-shadow:0 4px 14px rgba(37,61,80,.05); transition:border-color .18s,box-shadow .18s,transform .18s; }
    .entry:hover { border-color:#9bc9fb; box-shadow:0 10px 22px rgba(37,61,80,.1); transform:translateY(-2px); }
    .entry.teacher { border-top-color:var(--green); }
    .entry-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
    .entry-icon { width:46px; height:46px; display:grid; place-items:center; color:var(--blue); border-radius:6px; background:var(--blue-soft); }
    .teacher .entry-icon { color:var(--green); background:var(--green-soft); }
    .entry-icon svg { width:24px; height:24px; }
    .tag { padding:4px 8px; color:var(--blue); border-radius:4px; background:var(--blue-soft); font-size:12px; }
    .teacher .tag { color:var(--green); background:var(--green-soft); }
    .entry h2 { margin:22px 0 10px; font-size:20px; }
    .entry p { margin:0; color:var(--muted); font-size:14px; line-height:1.75; }
    .entry-action { margin-top:auto; padding-top:22px; display:flex; align-items:center; justify-content:space-between; color:var(--blue); font-weight:600; }
    .teacher .entry-action { color:var(--green); }
    .entry-action svg { width:18px; height:18px; }
    .notice { margin-top:20px; padding:14px 16px; display:flex; align-items:center; gap:10px; color:#577087; border:1px solid #cfe2f3; border-radius:6px; background:#f7fbff; font-size:13px; }
    .notice svg { width:18px; height:18px; flex:0 0 auto; color:var(--blue); }
    @media (max-width:1050px) {
      .layout { grid-template-columns:176px minmax(0,1fr); }
      main { padding:26px; }
      .entries { grid-template-columns:1fr; }
      .entry { min-height:210px; }
    }
    @media (max-width:680px) {
      .topbar { height:58px; padding:0 18px; }
      .top-meta,.environment { display:none; }
      .layout { min-height:calc(100vh - 58px); display:block; }
      .sidebar { padding:0 12px; display:flex; overflow-x:auto; background:var(--nav-strong); }
      .sidebar-title { display:none; }
      .nav-item { width:auto; min-width:max-content; height:48px; border-left:0; border-bottom:3px solid transparent; }
      .nav-item.active { border-bottom-color:#35b5e8; }
      main { padding:22px 16px 30px; }
      .page-head { align-items:flex-start; flex-direction:column; }
      .summary { gap:16px; }
      .entries { gap:14px; }
      .entry { min-height:200px; padding:20px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark"><i data-lucide="layers-3"></i></span>校本组卷项目 <span class="environment">演示环境</span></div>
    <div class="top-meta">统一原型入口</div>
  </header>
  <div class="layout">
    <aside class="sidebar" aria-label="原型导航">
      <div class="sidebar-title">项目导航</div>
      <a class="nav-item active" href="portal.html"><i data-lucide="layout-grid"></i>原型目录</a>
      <a class="nav-item" href="index.html"><i data-lucide="settings-2"></i>ADM 管理端</a>
      <a class="nav-item" href="../../teacher-question-selection-paper-optimization/demo/0902-question-list-page.html"><i data-lucide="monitor"></i>教师 PC 端</a>
      <a class="nav-item" href="../../teacher-question-selection-paper-optimization/demo/0907-mobile-question-list-page.html"><i data-lucide="smartphone"></i>教师移动端</a>
    </aside>
    <main>
      <div class="breadcrumb">内容生产平台 / 校本组卷 / 原型目录</div>
      <div class="page-head">
        <div><h1>校本组卷整体原型</h1><p class="subtitle">选择需要查看的业务端</p></div>
        <div class="summary"><span><strong>3</strong>个入口</span><span><strong>2</strong>个使用端</span></div>
      </div>
      <section class="entries" aria-label="原型入口">
        <a class="entry" href="index.html">
          <div class="entry-head"><span class="entry-icon"><i data-lucide="settings-2"></i></span><span class="tag">后台</span></div>
          <h2>ADM 组卷管理</h2>
          <p>校本管理、跨来源选题组卷、发布下架、授权管理与作答预览。</p>
          <span class="entry-action">进入 ADM 原型 <i data-lucide="arrow-right"></i></span>
        </a>
        <a class="entry teacher" href="../../teacher-question-selection-paper-optimization/demo/0902-question-list-page.html">
          <div class="entry-head"><span class="entry-icon"><i data-lucide="monitor"></i></span><span class="tag">PC</span></div>
          <h2>教师 PC 端布置</h2>
          <p>教师查看授权校本、管理试卷篮、编辑试卷并完成练习布置。</p>
          <span class="entry-action">进入 PC 原型 <i data-lucide="arrow-right"></i></span>
        </a>
        <a class="entry teacher" href="../../teacher-question-selection-paper-optimization/demo/0907-mobile-question-list-page.html">
          <div class="entry-head"><span class="entry-icon"><i data-lucide="smartphone"></i></span><span class="tag">移动</span></div>
          <h2>教师移动端布置</h2>
          <p>移动端查看练习、打开草稿篮、编辑试卷并进入布置流程。</p>
          <span class="entry-action">进入移动端原型 <i data-lucide="arrow-right"></i></span>
        </a>
      </section>
      <div class="notice"><i data-lucide="info"></i>三个入口共享同一业务方案；原型数据分别保存在各页面的本地浏览器中。</div>
    </main>
  </div>
  <script src="../assets/lucide.min.js"></script>
  <script>window.lucide && window.lucide.createIcons();</script>
</body>
</html>
