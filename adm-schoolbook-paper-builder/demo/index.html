<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>组卷管理 · ADM</title>
  <link rel="stylesheet" href="answer-preview.css">
  <link rel="stylesheet" href="source-picker.css">
  <link rel="stylesheet" href="reading-picker.css">
  <style>
    :root { --blue:#409eff; --blue-dark:#2486e9; --ink:#303740; --muted:#9099a5; --line:#e2e6ed; --bg:#f3f5f8; --nav:#263238; --green:#24a47e; --orange:#e59a32; --red:#ee6464; }
    * { box-sizing:border-box; letter-spacing:0; }
    [hidden] { display:none !important; }
    body:has(.modal-layer) { overflow:hidden; }
    body { margin:0; color:var(--ink); background:var(--bg); font:14px/1.6 "Microsoft YaHei",Arial,sans-serif; }
    button,input,select,textarea { font:inherit; }
    button,a,select,input[type=checkbox],input[type=radio] { cursor:pointer; }
    button { border:0; background:none; color:inherit; }
    a { color:var(--blue-dark); text-decoration:none; }
    input,select,textarea { max-width:100%; border:1px solid #d8dee8; border-radius:4px; padding:8px 11px; background:#fff; color:var(--ink); outline:none; }
    input:focus,select:focus,textarea:focus { border-color:var(--blue); box-shadow:0 0 0 2px #409eff12; }
    input[type=checkbox],input[type=radio] { width:16px; height:16px; margin:0; accent-color:var(--blue); flex:none; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    button:focus-visible,a:focus-visible { outline:2px solid var(--blue); outline-offset:3px; }
    h1,h2,h3,p { margin:0; }
    h1 { font-size:21px; } h2 { font-size:17px; } h3 { font-size:15px; }
    .ico { width:17px; height:17px; stroke-width:1.7; flex:none; vertical-align:middle; }
    .topbar { height:56px; background:#37474f; color:#c0cbd0; display:flex; align-items:center; padding:0 24px; gap:22px; position:fixed; top:0; right:0; left:0; z-index:30; }
    .topbar .brand { color:#fff; font-size:16px; font-weight:600; }
    .topbar .right { margin-left:auto; display:flex; align-items:center; gap:22px; font-size:13px; }
    .topbar .mode-link { color:#e0eef4; display:flex; align-items:center; gap:7px; }
    .env { font-size:11px; color:#abc1cc; border:1px solid #67808c; border-radius:3px; padding:1px 6px; }
    .sidebar { position:fixed; top:56px; bottom:0; left:0; width:220px; background:var(--nav); color:#c3cdd2; overflow-y:auto; z-index:20; }
    .side-row { display:flex; align-items:center; gap:13px; min-height:49px; padding:0 21px; width:100%; text-align:left; }
    .side-row .chevron { margin-left:auto; width:14px; }
    .side-row>.ico:last-child { margin-left:auto; width:14px; }
    .side-section { margin-top:10px; border-top:1px solid #3a484e; padding-top:6px; }
    .side-row.selected { background:#37474f; color:#fff; box-shadow:inset 3px 0 #2fb5e1; }
    .subnav { padding:4px 0 12px; background:#202b30; }

    .subnav button.active { color:#4cb3ff; background:#1b272d; }
    .subnav button:hover,.side-row[data-action]:hover { background:#334249; }
    .main { margin-left:220px; padding:79px 26px 32px; min-height:100vh; }
    .nav-small .sidebar { width:64px; } .nav-small .sidebar .nav-text,.nav-small .sidebar .chevron,.nav-small .subnav { display:none; }
    .nav-small .main { margin-left:64px; }
    .breadcrumb { display:flex; align-items:center; gap:10px; font-size:13px; color:#8a94a0; margin-bottom:19px; }
    .breadcrumb strong { color:#525d6b; font-weight:400; }
    .page-head { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:19px; }
    .page-head .title { display:flex; gap:12px; align-items:center; }
    .page-head .subtitle { font-size:13px; color:var(--muted); margin-top:4px; }
    .actions { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
    .btn { min-height:35px; padding:6px 15px; border:1px solid #d7dee8; border-radius:4px; background:#fff; display:inline-flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; line-height:1.5; }
    .btn:hover { color:var(--blue-dark); border-color:#a9d4ff; background:#f4f9ff; }
    .btn.primary { background:var(--blue); color:#fff; border-color:var(--blue); box-shadow:0 2px 3px #1d80d51a; }
    .btn.primary:hover { background:#258ff8; }

    .icon-btn:hover { background:#edf5ff; color:var(--blue-dark); }
    .icon-btn.danger:hover { color:var(--red); background:#fff2f2; }
    .filters { background:#fff; border:1px solid #edf0f4; padding:22px 23px; margin-bottom:18px; display:flex; flex-wrap:wrap; align-items:end; gap:18px 22px; }
    .filters label { display:flex; align-items:center; gap:10px; white-space:nowrap; }
    .filters input { width:224px; background:#f8f9fb; }
    .filters select { width:166px; background:#f8f9fb; }
    .filters .actions { margin-left:auto; }
    .band { background:#fff; padding:21px 22px 16px; }
    .band-head { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:19px; }
    .count { font-size:12px; color:#96a1af; font-weight:400; margin-left:8px; }
    .tab { padding:0 3px 14px; position:relative; color:#7a8492; white-space:nowrap; }
    .tab.active { color:var(--blue-dark); font-weight:600; }

    .table-scroll { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:13px; table-layout:fixed; }

    td { padding:16px 13px; border:1px solid var(--line); vertical-align:middle; overflow-wrap:anywhere; }
    tbody tr:nth-child(even) { background:#fafbfc; }
    tbody tr:hover { background:#f5faff; }
    td .cell-title { color:#338feb; font-weight:500; display:block; margin-bottom:4px; }
    .muted { color:var(--muted); } .small-text { font-size:12px; }
    .subline { display:block; color:#9aa4b1; font-size:11px; margin-top:3px; }
    .badge { display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:3px; background:#ecf5ff; color:#358fe6; font-size:12px; white-space:nowrap; }

    .badge.gray { color:#939aa4; background:#eef0f3; }
    .row-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

    .pager select { padding:5px 8px; font-size:12px; }

    .empty { padding:65px 20px; text-align:center; color:#98a4b2; }
    .empty .ico { width:34px; height:34px; margin-bottom:13px; color:#b5c5d6; }
    .work-summary { margin-left:auto; color:#8b96a4; font-size:12px; }
    .workspace { display:grid; grid-template-columns:242px minmax(330px,1fr) 258px; gap:16px; align-items:start; }
    .source-pane { background:#fff; border:1px solid var(--line); position:sticky; top:72px; max-height:calc(100vh - 92px); overflow:auto; }
    .pane-head { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; font-weight:600; }
    .pane-tools { padding:12px; border-bottom:1px solid #edf0f4; } .pane-tools input { width:100%; font-size:12px; }
    .book-group { border-bottom:1px solid #edf0f4; }
    .book-select { display:flex; gap:8px; align-items:flex-start; padding:14px 12px; cursor:pointer; font-size:12px; }
    .book-select input { margin-top:3px; } .book-select .book-name { flex:1; }
    .book-select.selected { color:var(--blue-dark); background:#f0f7ff; }
    .tree-leaf { width:100%; display:flex; align-items:center; gap:6px; padding:8px 12px 8px 36px; font-size:12px; color:#7d8b9c; text-align:left; }
    .tree-leaf.active { color:var(--blue-dark); background:#edf6ff; }
    .tree-leaf:hover { background:#f6f8fb; }
    .q-filters { background:#fff; padding:14px 16px; border:1px solid var(--line); margin-bottom:12px; }

    .q-filter-options { display:flex; gap:9px; flex-wrap:wrap; } .q-filter-options select { min-width:110px; flex:1; padding:6px; font-size:12px; }
    .q-list-head { display:flex; align-items:center; gap:8px; margin-bottom:12px; color:#8590a0; font-size:12px; }
    .q-list-head .link { margin-left:auto; }
    .question-card { background:#fff; border:1px solid var(--line); border-radius:4px; margin-bottom:12px; }
    .question-card.chosen { border-color:#afd6ff; }
    .question-top { display:flex; align-items:center; gap:6px; padding:13px 16px 8px; font-size:12px; }

    .question-body { padding:5px 16px 14px; }
    .stem { font-size:14px; line-height:1.85; color:#444d59; }
    .options-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; margin-top:12px; color:#687686; font-size:12px; }
    .options-grid div { padding:5px 8px; background:#f7f8fa; border-radius:3px; }
    .question-foot { border-top:1px solid #f0f2f5; padding:10px 16px; display:flex; align-items:center; gap:10px; font-size:11px; color:#99a2af; }
    .question-foot .link { margin-left:auto; }
    .source-path { min-width:0; flex:1; }
    .answer { background:#f0faf5; border-top:1px solid #deefe5; padding:11px 16px; color:#418a6d; font-size:12px; }
    .basket-pane { background:#fff; border:1px solid var(--line); position:sticky; top:72px; }
    .basket-stats { display:grid; grid-template-columns:1fr 1fr; text-align:center; padding:18px 5px; background:#f7faff; border-bottom:1px solid var(--line); }
    .basket-stats strong { display:block; color:var(--blue-dark); font-size:23px; line-height:1.2; font-weight:500; }
    .basket-stats span { font-size:11px; color:#8d9bad; }
    .basket-sources { padding:13px 14px; display:flex; flex-wrap:wrap; gap:6px; border-bottom:1px solid var(--line); font-size:11px; }
    .basket-list { max-height:calc(100vh - 445px); min-height:160px; overflow:auto; padding:4px 12px; }
    .basket-item { display:flex; align-items:center; gap:9px; padding:10px 0; border-bottom:1px dashed #e5eaf0; font-size:12px; }
    .basket-item .item-name { flex:1; min-width:0; }
    .basket-item strong { font-weight:500; } .basket-item small { display:block; color:#9aa5b2; font-size:10px; }
    .basket-item .num { color:#9aabc0; font-size:11px; }
    .basket-footer { padding:16px 13px; border-top:1px solid var(--line); display:grid; gap:9px; }
    .basket-footer .btn { width:100%; }
    .selection-note { color:#8996a7; font-size:11px; padding:12px 14px; background:#fafbfd; }
    .editor-layout { display:grid; grid-template-columns:minmax(0,1fr) 290px; gap:18px; }
    .section-head { background:#eef4fb; padding:13px 17px; display:flex; gap:12px; align-items:center; margin-bottom:0; }
    .section-head h3 { min-width:0; overflow-wrap:anywhere; }
    .section-head span { font-size:12px; color:#98a2ae; }
    .section-head [data-action="rename-type"] { color:var(--blue-dark); }
    .section-head .actions { margin-left:auto; }
    .edit-question { background:#fff; padding:20px; border:1px solid var(--line); border-top:0; }
    .edit-question .tools { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
    .edit-question .tools .actions { margin-left:auto; }
    .score-input { width:64px; padding:5px 6px; height:31px; text-align:center; font-size:12px; }
    .form-panel { background:#fff; border:1px solid var(--line); padding:18px; position:sticky; top:72px; }
    .form-panel h3 { margin-bottom:18px; }
    .field { display:block; margin-bottom:16px; }
    .field>span { display:block; font-size:12px; color:#7e8b9b; margin-bottom:6px; }
    .field input:not([type=checkbox]):not([type=radio]),.field select,.field textarea { width:100%; }
    .field .required { color:var(--red); }
    .divider { height:1px; background:var(--line); margin:17px 0; }
    .stat-row { display:flex; justify-content:space-between; font-size:13px; margin:10px 0; }
    .stat-row strong { color:var(--blue-dark); }
    .full { width:100%; }
    .sticky-footer { position:sticky; bottom:0; z-index:5; padding:14px 20px; border-top:1px solid var(--line); background:#fffffff5; display:flex; align-items:center; justify-content:center; margin-top:18px; }
    .editor-layout .form-panel>.divider:last-of-type,
    .editor-layout .form-panel>.divider:last-of-type + .text-note { display:none; }
    .editor-layout .form-panel>p.subline + .divider + .stat-row,
    .editor-layout .form-panel>p.subline + .divider + .stat-row + .stat-row { display:none; }
    .info-banner { display:flex; gap:9px; align-items:flex-start; padding:12px 16px; background:#f0f7ff; color:#6484a9; border:1px solid #deecfb; font-size:12px; margin-bottom:18px; }
    .info-banner .ico { margin-top:2px; } .info-banner.warn { background:#fff8ed; color:#b38947; border-color:#f5e5c9; }
    .book-title-cell { display:flex; gap:11px; align-items:center; }
    .book-art { width:33px; height:43px; background:#e9f3ff; border-left:4px solid #4397ed; display:grid; place-items:center; flex:none; color:#4397ed; border-radius:2px 4px 4px 2px; }
    .book-art.teal { background:#e9f7f2; border-color:#3ea88b; color:#3ea88b; }
    .book-art.amber { background:#fff5e7; border-color:#d4a044; color:#d4a044; }
    .modal-layer { position:fixed; inset:0; z-index:100; background:#15212d70; display:grid; grid-template-columns:minmax(0,1fr); place-items:center; padding:24px; }
    .modal { width:640px; max-width:100%; max-height:calc(100vh - 48px); display:flex; flex-direction:column; background:#fff; border-radius:6px; box-shadow:0 12px 60px #10223525; overflow:hidden; }
    .modal.wide { width:940px; }
    .modal.source-picker-modal { width:min(1480px,calc(100vw - 48px)); height:min(900px,calc(100dvh - 48px)); }
    .modal.source-picker-modal .modal-body { flex:1; min-height:0; padding:0; background:#f4f6f8; }
    .modal-head { display:flex; justify-content:space-between; align-items:center; padding:18px 24px; border-bottom:1px solid var(--line); }
    .modal-body { padding:23px 24px; overflow:auto; }
    .modal-footer { display:flex; align-items:center; justify-content:flex-end; gap:10px; padding:14px 24px; border-top:1px solid var(--line); background:#fff; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 19px; }
    .form-grid .span2 { grid-column:1/-1; }
    .choice-line { display:flex; align-items:center; flex-wrap:wrap; gap:18px; min-height:32px; }
    .choice-line label { display:flex; align-items:center; gap:7px; white-space:nowrap; }
    .check-list { border:1px solid var(--line); border-radius:4px; max-height:186px; overflow:auto; }
    .check-list label { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid #f0f2f5; }
    .check-list small { margin-left:auto; color:#98a3b1; font-size:11px; }
    .auth-selection-count { margin-left:8px; color:var(--blue-dark); font-weight:400; }
    .auth-teacher-search { position:relative; margin-bottom:8px; }

    .auth-teacher-search input { width:100%; padding-left:36px; }

    .check-row { display:flex; align-items:center; gap:8px; }

    .publish-summary span { color:#8d9aaa; font-size:12px; }

    .check-result small { margin-left:auto; color:#98a2ad; }
    .success-title { display:flex; align-items:center; gap:11px; margin-bottom:16px; font-size:20px; }

    .preview-meta { text-align:center; color:#94a0b0; font-size:12px; margin-bottom:22px; }
    .preview-item { padding:18px 0; border-bottom:1px solid #edf0f4; }
    .teacher-tabs { display:flex; gap:28px; margin:0 0 18px; }
    .teacher-grid { display:grid; grid-template-columns:255px minmax(0,1fr); gap:18px; }

    .teacher-book.active { background:#edf6ff; color:var(--blue-dark); box-shadow:inset 3px 0 var(--blue); }
    .teacher-book small { display:block; color:#93a0b0; margin-top:6px; }

    .text-note { color:#8f9aa7; font-size:12px; }

    if(t.id==='teacherSelect'){app.teacherId=t.value;app.teacherBook='all';app.adjustment=null;render();}
    if(t.id==='previewAnswers'){const {id,teacher,version}=app.preview,p=db.papers.find(x=>x.id===id),s=version?p.versions.find(v=>v.version===Number(version)):teacher?latest(p):p;$('#previewContent').innerHTML=previewContent(s.name,s.items,version||teacher?s.version:null,t.checked,paperDuration(s));}
    if(t.name==='flow'&&t.closest('#assignForm'))$('#assignMode').hidden=t.value==='no';
    if(t.dataset.adjustScore){const v=Number(t.value);if(!Number.isFinite(v)||v<.5||v>100){toast('分值需在 0.5 至 100 之间','error');showAdjustment(app.adjustment.paperId,true);return;}app.adjustment.items.find(q=>q.id===t.dataset.adjustScore).score=v;showAdjustment(app.adjustment.paperId,true);}
  });
  document.addEventListener('input',e=>{if(e.target.id==='adjustName')app.adjustment.name=e.target.value;if(e.target.id==='authTeacherSearch')filterAuthTeachers(e.target.value);});
  document.addEventListener('keydown',e=>{const layer=$('#modalRoot .modal');if(!layer)return;if(e.key==='Escape'){if(window.SourcePicker?.isOpen())app.replaceId=null;closeModal();return;}if(e.key==='Tab'){const nodes=[...layer.querySelectorAll('button:not(:disabled),input:not([type=hidden]),select,textarea')].filter(el=>el.getClientRects().length);if(!nodes.length)return;const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
  window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY&&e.newValue){try{db=JSON.parse(e.newValue);migrateDirectories(db);render();}catch{}}});
  persist();render();
  </script>
  <script src="answer-preview.js"></script>
</body>
</html>
